; worker da fila de lembretes na VPS (/etc/supervisor/conf.d/horalis-worker.conf)
[program:horalis-worker]
command=php /var/www/horalis/artisan queue:work redis --queue=notificacoes,default --tries=5
user=deploy
autostart=true
autorestart=true
numprocs=1
stopwaitsecs=130
stdout_logfile=/var/log/horalis-worker.log
redirect_stderr=true
