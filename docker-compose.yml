version: '3.7'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan queue:work redis --queue=notificacoes,default --tries=5
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.15-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:11
    environment:
      POSTGRES_DB: horalis
      POSTGRES_USER: horalis
      POSTGRES_PASSWORD: horalis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:5-alpine

  s3:
    image: minio/minio:RELEASE.2021-08-05T22-01-19Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: horalis
      MINIO_ROOT_PASSWORD: horalis-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data

  s3-bucket:
    image: minio/mc:RELEASE.2021-07-27T06-46-19Z
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 horalis horalis-local; do sleep 1; done;
      mc mb --ignore-existing local/horalis-anexos;
      "

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

volumes:
  pgdata:
  s3data:
