x-app: &app
  image: horalis-app:dev
  pull_policy: never
  volumes:
    - ./.env:/var/www/html/.env:ro
  depends_on:
    - app

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
    pull_policy: build
    depends_on:
      - postgres
      - redis
      - s3

  worker:
    <<: *app
    command: php artisan queue:work redis --queue=notificacoes,default --tries=3 --timeout=60

  scheduler:
    <<: *app
    command: php artisan schedule:work

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horalis
      POSTGRES_USER: horalis
      POSTGRES_PASSWORD: horalis
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  s3:
    image: minio/minio:RELEASE.2023-06-29T05-12-28Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: horalis
      MINIO_ROOT_PASSWORD: horalis-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data

  s3-bucket:
    image: minio/mc:RELEASE.2023-06-28T21-54-17Z
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 horalis horalis-local; do sleep 1; done;
      mc mb --ignore-existing local/horalis-anexos;
      "

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

volumes:
  postgres-data:
  s3-data:
