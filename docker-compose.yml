x-app: &app
  image: horalis-app:dev
  pull_policy: never
  volumes:
    - ./.env:/var/www/html/.env:ro
  depends_on:
    app:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/horalis-pronto"]
      interval: 5s
      timeout: 3s
      retries: 60

  worker:
    <<: *app
    command: php artisan queue:work redis --queue=notificacoes,default --tries=3 --timeout=60

  scheduler:
    <<: *app
    command: php artisan schedule:work

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horalis
      POSTGRES_USER: horalis
      POSTGRES_PASSWORD: horalis
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horalis -d horalis"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: adobe/s3mock:4.7.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: horalis-anexos
    ports:
      - "9090:9090"

volumes:
  postgres-data:
